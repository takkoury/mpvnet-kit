osc=no
title-bar=no
# Text-only action feedback; preserve the existing OSD font and rendering settings.
osd-align-x=left
osd-align-y=top
osd-duration=1000
osd-bar=no
osd-on-seek=no
osd-playing-msg=
# Only designed player keys; mpv.net's injected menu keys are overridden in input.conf.
# Keep the space after '=': mpv.net 7.1.2's legacy migration otherwise
# overwrites mpvnet.conf instead of this file. mpv accepts this equivalent form.
input-default-bindings= no
# Local automatic queues contain only the current video/audio category.
autocreate-playlist=same
directory-filter-types=video,audio
directory-mode=ignore
# External subtitles may add release/language suffixes; do not load unrelated episodes.
sub-auto=fuzzy
sub-file-paths=sub;subs;subtitles;字幕
# Prefer Chinese, then Japanese, then English subtitles; leave audio track choice to the file.
slang=zh,zho,chi,ja,jpn,en,eng
alang=
sub-visibility=yes
# Stable renderer fallback and conservative automatic hardware decoding.
vo=gpu-next,gpu
hwdec=auto-safe
# Keep the renderer target automatic. A display-specific profile can override it.
target-trc=auto
