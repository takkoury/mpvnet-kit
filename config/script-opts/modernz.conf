# First control-bar layout pass. Other behavior keeps upstream defaults.
layout=default
# Unified interactive accent; normal white labels/icons and gray tracks keep their palette.
seekbarfg_color=#1287bb
seek_handle_color=#1287bb
seek_handle_border_color=#1287bb
hover_effect_color=#1287bb
held_element_color=#1287bb
nibble_color=#1287bb
ab_loop_color=#1287bb
windowcontrols_max_hover=#1287bb
windowcontrols_min_hover=#1287bb
windowcontrols_close_hover=#1287bb
volumebar_match_seek_color=yes
title=${filename}
show_chapter_title=no
truncate_title=yes
time_format=dynamic
timecurrent=yes
seekbar_wheel_up_command=script-message-to playback_feedback seek -10 relative+exact
seekbar_wheel_down_command=script-message-to playback_feedback seek 10 relative+exact
audio_tracks_button=no
sub_track_mbtn_left_command=script-binding subtitle_controls/toggle
sub_track_mbtn_right_command=script-binding subtitle_controls/select
sub_track_mbtn_mid_command=ignore
sub_track_wheel_up_command=ignore
sub_track_wheel_down_command=ignore
fullscreen_button=no
speed_font_size=14
enhancement_button=yes
speed_mbtn_left_command=ignore
speed_mbtn_right_command=script-message-to playback_feedback set-speed 1
speed_wheel_down_command=script-message-to playback_feedback add-speed -0.25
speed_wheel_up_command=script-message-to playback_feedback add-speed 0.25
play_pause_mbtn_left_command=script-binding playback_feedback/toggle-pause
play_pause_mbtn_right_command=ignore
play_pause_mbtn_mid_command=ignore
title_mbtn_left_command=script-binding playback_feedback/copy-media-path
title_mbtn_right_command=script-binding playback_feedback/open-media-path
title_mbtn_mid_command=ignore
playlist_prev_mbtn_left_command=script-binding playlist_controls/previous
playlist_prev_mbtn_right_command=ignore
playlist_prev_mbtn_mid_command=ignore
playlist_next_mbtn_left_command=script-binding playlist_controls/next
playlist_next_mbtn_right_command=ignore
playlist_next_mbtn_mid_command=ignore
playlist_mbtn_left_command=script-binding playlist_controls/toggle
playlist_mbtn_right_command=ignore
vol_ctrl_wheel_down_command=no-osd add volume -5
vol_ctrl_wheel_up_command=no-osd add volume 5
vol_ctrl_mbtn_right_command=no-osd set volume 100
vol_ctrl_mbtn_mid_command=script-binding select/select-aid
volumebar_wheel_down_command=no-osd add volume -5
volumebar_wheel_up_command=no-osd add volume 5
loop_button=no
info_mbtn_left_command=script-binding playback_feedback/media-info
ontop_mbtn_left_command=script-binding playback_feedback/ontop
screenshot_mbtn_left_command=script-binding capture_controls/screenshot
screenshot_mbtn_right_command=script-binding capture_controls/clip-point
screenshot_mbtn_mid_command=script-binding capture_controls/open-folder
download_button=no
